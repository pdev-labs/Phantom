name: Android Release Build

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version Name (e.g., 5.0)'
        required: true
        default: '5.0'
      version_code:
        description: 'Version Code (integer)'
        required: true
        default: '50'
      release_notes:
        description: 'Release Notes'
        required: false
        default: 'Automated release build'

jobs:
  release:
    name: Build and Sign Release APK
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev libffi-dev python3-dev
          sudo apt-get install -y zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake apksigner
          pip install --upgrade Cython==0.29.33 virtualenv buildozer

      - name: Update version in buildozer.spec
        run: |
          sed -i 's/^version = .*/version = ${{ github.event.inputs.version_name }}/' prank_android_combined/buildozer.spec

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release-keystore.jks

      - name: Build and Sign Release APK (Phantom Combined)
        working-directory: prank_android_combined
        env:
          P4A_RELEASE_KEYSTORE: ${{ github.workspace }}/release-keystore.jks
          P4A_RELEASE_KEYALIAS: ${{ secrets.KEY_ALIAS }}
          P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.KEYSTORE_PASSWORD }}
          P4A_RELEASE_KEYALIAS_PASSWD: ${{ secrets.KEY_PASSWORD }}
        run: |
          yes | buildozer android release

      - name: Verify APK Signature and Extract Fingerprint
        id: verify_sig
        run: |
          APK_FILE=$(find prank_android_combined/bin -name "*-release.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: Release APK not found!"
            exit 1
          fi
          echo "APK_PATH=$APK_FILE" >> $GITHUB_ENV
          
          # Verify signature
          apksigner verify --verbose --print-certs "$APK_FILE" > apksigner_output.txt
          
          # Check if verify was successful
          if [ $? -ne 0 ]; then
            echo "Signature verification failed!"
            cat apksigner_output.txt
            exit 1
          fi
          
          # Extract SHA-256 fingerprint from output
          SHA256_FINGERPRINT=$(grep "Signer #1 certificate SHA-256 digest:" apksigner_output.txt | awk '{print $6}')
          echo "FINGERPRINT=$SHA256_FINGERPRINT" >> $GITHUB_ENV

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: phantom-release-apk
          path: ${{ env.APK_PATH }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ github.event.inputs.version_name }}"
          name: "Phantom v${{ github.event.inputs.version_name }}"
          body: ${{ github.event.inputs.release_notes }}
          files: |
            ${{ env.APK_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Display Final Output
        if: always()
        run: |
          echo "BUILD: SUCCESS"
          echo "APK: phantom-release-apk"
          echo "SIGNATURE: VERIFIED"
          echo "CERTIFICATE SHA-256: ${{ env.FINGERPRINT }}"
          echo "VERSION NAME: ${{ github.event.inputs.version_name }}"
          echo "VERSION CODE: ${{ github.event.inputs.version_code }}"

      - name: Security Cleanup
        if: always()
        run: |
          rm -f release-keystore.jks
          rm -f apksigner_output.txt
