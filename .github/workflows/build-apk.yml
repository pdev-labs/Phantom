name: Build Android APKs

on:
  push:
    branches:
      - main
    paths:
      - 'prank_android_1_basic/**'
      - 'prank_android_2_sensors/**'
      - 'prank_android_combined/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build APK for ${{ matrix.project }}
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        project: [prank_android_1_basic, prank_android_2_sensors, prank_android_combined]
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev libffi-dev python3-dev
          sudo apt-get install -y zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake
          pip install --upgrade Cython==0.29.33 virtualenv buildozer

      - name: Cache Buildozer global directory
        uses: actions/cache@v3
        with:
          path: ~/.buildozer
          key: buildozer-global-${{ hashFiles(format('{0}/buildozer.spec', matrix.project)) }}
          restore-keys: |
            buildozer-global-

      - name: Build with Buildozer
        working-directory: ${{ matrix.project }}
        run: |
          yes | buildozer android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: phantom-apk-${{ matrix.project }}
          path: ${{ matrix.project }}/bin/*.apk

  build-desktop:
    name: Build Desktop for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pygame pynput
      - name: Build with PyInstaller
        run: python build_desktop.py
      
      - name: Package for Linux (deb & AppImage)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update && sudo apt-get install -y rubygems libfuse2
          sudo gem install fpm
          wget -O appimagetool "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool
          
          for app in phantom_desktop_basic phantom_desktop_sensors phantom_desktop_combined; do
            # Build .deb
            fpm -s dir -t deb -n $app -v 4.0 --prefix /usr/bin dist/$app=/usr/bin/$app
            mv *.deb dist/
            
            # Build .AppImage
            mkdir -p AppDir/usr/bin
            cp dist/$app AppDir/usr/bin/
            echo -e "[Desktop Entry]\nName=$app\nExec=$app\nIcon=$app\nType=Application\nCategories=Utility;" > AppDir/$app.desktop
            touch AppDir/$app.png
            echo -e '#!/bin/sh\ncd "$(dirname "$0")"\nexec ./usr/bin/'$app > AppDir/AppRun
            chmod +x AppDir/AppRun
            ./appimagetool AppDir dist/$app-x86_64.AppImage
            rm -rf AppDir
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: phantom-desktop-${{ matrix.os }}
          path: dist/*

  release:
    name: Create GitHub Release
    needs: [build, build-desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "v4.0"
          name: "Phantom v4.0 (Android & Desktop Collection)"
          files: |
            artifacts/**/*.apk
            artifacts/**/*desktop*/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
