name: Build Standalone Binaries

on:
  push:
    branches:
      - main
    paths:
      - 'prank_2_input_trigger/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller pynput
        
    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      run: pip install evdev
        
    - name: Build executable
      working-directory: prank_2_input_trigger
      run: |
        pyinstaller --onefile --noconsole prank_input.py
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: phantom-prank2-${{ matrix.os }}
        path: |
          prank_2_input_trigger/dist/prank_input*
          prank_2_input_trigger/*.mp3
